{% extends "veterinaria/base.html" %}{% block contenido %}<div class="card"><h1>{{ titulo }}</h1>{% if tipo == 'mascota' %}<a class="btn" href="{% url 'mascota_nueva' %}">Agregar</a>{% else %}<a class="btn" href="{% url 'cita_nueva' %}">Agendar</a>{% endif %}<ul>{% for objeto in objetos %}<li><a href="{{ objeto.get_absolute_url }}">{{ objeto }}</a></li>{% empty %}<li>No hay registros.</li>{% endfor %}</ul></div>{% endblock %}
