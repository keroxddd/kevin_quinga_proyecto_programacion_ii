{% extends "veterinaria/base.html" %}

{% block titulo %}{{ titulo }}{% endblock %}

{% block contenido %}
	<section class="card">
		<h1>{{ titulo }}</h1>
		<form method="post">
			{% csrf_token %}
			{{ form.as_p }}
			<button type="submit">Guardar</button>
		</form>
		<p>
			<a href="{% if user.is_authenticated %}{% url 'panel' %}{% else %}{% url 'inicio' %}{% endif %}">
				← Volver
			</a>
		</p>
	</section>
{% endblock %}
